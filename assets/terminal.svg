<svg width="980" height="430" viewBox="0 0 980 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI systems boot terminal">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="980" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF2D95"/>
    </linearGradient>
    <style>
      @keyframes glow { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes caret { 50%{opacity:0} }
