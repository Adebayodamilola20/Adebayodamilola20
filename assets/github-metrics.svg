  <text x="60" y="92" fill="#00F5FF" font-size="28" font-weight="900">GITHUB METRICS PIPELINE READY</text>
  <text x="60" y="146" fill="#F8FBFF" font-size="44" font-weight="900">Automated stats will render here.</text>
